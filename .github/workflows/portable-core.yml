name: Portable core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Build frontend
        run: pnpm build
      - name: Test platform information retry
        run: node --test src/platform-info-retry.test.mjs

  windows:
    name: Windows Rust checks
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Check all Rust targets
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Run Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test all Rust targets
        working-directory: src-tauri
        run: cargo test --all-targets
      - name: Smoke-test shared shell defaults
        working-directory: src-tauri
        run: cargo test shared_shell_state_smoke_preserves_neutral_defaults

  portable-native:
    name: Native shared core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux system packages
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.93.1
      - name: Check all Rust targets
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: Test Rust library
        working-directory: src-tauri
        run: cargo test --lib
      - name: Smoke-test shared shell defaults
        working-directory: src-tauri
        run: cargo test --lib shared_shell_state_smoke_preserves_neutral_defaults
